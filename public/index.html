<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Hub｜地下城對抗</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<main>
<header>
<h1>GAME <em>HUB</em>
</h1>
</header>
<section id="home">
<div class="cards">
<article>
<div class="symbol">🐢</div>
<h2>海龜湯</h2>
<p>單人推理 · 是 / 不是 / 無關 · 三次提示</p>
<button onclick="openSoup()">開始推理</button>
</article>
<article>
<div class="symbol">⚔️</div>
<h2>團隊對抗</h2>
<p>5v5 地下城死鬥 · 真人與 AI 同場</p>
<button onclick="openLobby()">建立或加入房間</button>
</article>
</div>
</section>
<section id="soup" hidden>
<button class="ghost" onclick="home()">← 返回大廳</button>
<h2>🐢 海龜湯</h2>
<p class="muted">請提出可以用「是、不是、無關」回答的問題。這是本地題庫關鍵字判斷原型，非 AI 自由推理。</p>
<div class="panel">
<h3 id="soup-title">
</h3>
<p id="soup-story">
</p>
<p id="soup-progress">
</p>
<input id="question" placeholder="例如：他喝的是海龜湯嗎？">
<button onclick="askSoup()">提問</button>
<p id="answer">
</p>
<button class="secondary" onclick="hint()">取得提示（剩餘 <span id="hints">3</span> 次）</button>
<button class="secondary" onclick="reveal()">揭曉答案</button>
<button class="secondary" onclick="newSoup()">換一題</button>
<p id="soup-end">
</p>
</div>
</section>
<section id="lobby" hidden>
<button class="ghost" onclick="home()">← 返回首頁</button>
<h2>團隊對抗</h2>
<div class="panel">
<label>暱稱 <input id="nickname" maxlength="24" placeholder="輸入暱稱">
</label>
<button onclick="createRoom()">建立房間</button>
<label>房間代碼 <input id="room-code" maxlength="6" placeholder="ABC123">
</label>
<button class="secondary" onclick="joinRoom()">加入房間</button>
<p id="error">
</p>
</div>
<h3>目前房間</h3>
<div id="room-list">
</div>
</section><section id="game" hidden>
  <div class="room-heading">
    <h2>房間 <span id="room-id"></span></h2>
    <button class="ghost" onclick="exitRoom()">離開房間</button>
  </div>
  <p id="room-error" role="status"></p>
  <div id="waiting" class="panel">
    <section class="class-select" aria-label="選擇職業">
      <div id="class-options" class="class-options" role="group" aria-label="職業">
        <button type="button" id="class-warrior" data-job="warrior" aria-pressed="true">戰士</button>
        <button type="button" id="class-archer" data-job="archer" aria-pressed="false">弓箭手</button>
        <button type="button" id="class-mage" data-job="mage" aria-pressed="false">法師</button>
      </div>
      <div id="class-profile" data-job="warrior">
        <div class="class-portrait"><img id="class-art" src="/art/warrior.webp" alt="戰士立繪" width="512" height="1024" fetchpriority="high"></div>
        <div class="class-copy" aria-live="polite">
          <p id="class-role"></p>
          <h3 id="class-name">戰士</h3>
          <p id="job-description"></p>
          <dl class="class-stats">
            <div><dt>生命值</dt><dd id="class-hp"></dd></div>
            <div><dt>普攻距離</dt><dd id="class-range"></dd></div>
          </dl>
          <p class="class-skill"><kbd>Q</kbd> <strong id="class-skill"></strong></p>
        </div>
      </div>
    </section>
    <h3 id="seat-count"></h3>
    <div id="players" aria-label="玩家席位"></div>
    <div class="bot-settings">
      <div><strong id="bot-summary"></strong><p id="bot-help"></p></div>
      <div id="bot-controls" hidden>
        <button id="add-bot" class="secondary">加入一名 AI</button>
        <button id="fill-bots">一鍵補滿 AI</button>
      </div>
    </div>
    <div class="ready-actions">
      <button id="ready">準備</button>
      <button id="start">開始遊戲</button>
      <p id="start-help" role="status"></p>
    </div>
  </div>
  <div id="battle" hidden>
    <div class="scoreboard">
      <span class="red"><span>紅隊</span><strong id="red-score">0</strong></span>
      <span class="match-clock"><strong id="clock">05:00</strong><small>團隊死鬥</small></span>
      <span class="blue"><strong id="blue-score">0</strong><span>藍隊</span></span>
    </div>
    <div class="arena-frame">
      <canvas id="arena" width="960" height="576" aria-label="地下城團隊對抗地圖"></canvas>
      <p id="respawn" hidden></p>
    </div>
    <div class="hud">
      <div class="health-block"><span id="health"></span><progress id="health-bar" max="150" value="0" aria-label="生命值"></progress></div>
      <div class="ability"><kbd>左鍵</kbd><span id="attack-status"></span></div>
      <div class="ability"><kbd>Q</kbd><span id="skill-status"></span></div>
    </div>
    <p class="muted controls"><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 移動 · 滑鼠瞄準與左鍵攻擊 · <kbd>Q</kbd> 技能 · <kbd>Enter</kbd> 聊天</p>
    <ul id="kill-feed" aria-label="擊殺通知"></ul>
  </div>
  <section id="results" class="panel" hidden>
    <h3 id="winner"></h3>
    <div class="table-wrap"><table>
      <thead><tr><th>玩家</th><th>隊伍</th><th>職業</th><th>擊殺</th><th>死亡</th><th>傷害</th></tr></thead>
      <tbody id="results-body"></tbody>
    </table></div>
    <p id="results-note" class="muted"></p>
    <button id="return-lobby" class="secondary">返回大廳</button>
    <button id="rematch">再玩一局</button>
  </section>
  <section class="panel">
    <h3 id="chat-title">房間聊天</h3>
    <div id="messages" aria-live="polite"></div>
    <form id="chat-form">
      <input id="chat-input" maxlength="300" aria-label="聊天訊息" autocomplete="off" placeholder="輸入訊息">
      <button>傳送</button>
    </form>
  </section>
</section>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="soup-bank.js"></script>
<script src="app.js?v=3"></script>
<script src="arena-renderer.js?v=3"></script>
</body>
</html>
